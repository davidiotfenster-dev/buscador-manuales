version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: buscador_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env antes de levantar el stack}"
      POSTGRES_DB: buscador_manuales
    # Puerto NO expuesto al host por seguridad (solo accesible desde la red interna)
    # Descomenta la siguiente línea solo para desarrollo local:
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: buscador_web
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./manuales:/app/manuales
    environment:
      - "DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env}@db:5432/buscador_manuales"
      - "SECRET_KEY=${SECRET_KEY:?define SECRET_KEY en el .env, sin ella la aplicacion no arranca}"
      - TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE_MINUTES:-1440}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-}
      - YOUTUBE_SYNC_INTERVAL_HOURS=${YOUTUBE_SYNC_INTERVAL_HOURS:-24}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
