version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: buscador_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: buscador_manuales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: buscador_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/buscador_manuales
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
